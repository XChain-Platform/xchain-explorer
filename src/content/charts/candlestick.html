<!-- Candlestick Chart -->
<div id="market-chart-candlestick"></div>

<script type="text/javascript">

// Handle updating candlestick chart
function updateChart(){

    // Get the trade data from XC.CHART_DATA
    var data = XC.CHART_DATA.ohlc;

    if(data){
        // set the allowed units for data grouping
        var groupingUnits = [[
                'week',         // unit name
                [1]             // allowed multiples
            ], [
                'month',
                [1, 2, 3, 4, 6]
        ]];

        // Create chart config by applying any customizations to the default config
        var cfg = $.extend( true, {}, XC.CHART_CONFIG, {
            yAxis: [{
                labels: {
                    align: 'right',
                    x: -3
                },
                title: {
                    text: 'Price'
                },
                height: '60%',
                lineWidth: 2,
                min: 0
            }, {
                labels: {
                    align: 'right',
                    x: -3
                },
                title: {
                    text: 'Volume'
                },
                top: '65%',
                height: '35%',
                offset: 0,
                lineWidth: 2,
                min: 0
            }],
            series: [{
                // Open / High / Low / Close
                type: 'candlestick',
                id: 'ohlc',
                data: data.ohlc,
                dataGrouping: {
                    units: groupingUnits
                },
                tooltip: {
                    valueDecimals: 8
                }
            }, {
                // Volume
                type: 'column',
                id: 'volume',
                data: data.volume,
                yAxis: 1,
                dataGrouping: {
                    units: groupingUnits
                },
                tooltip: {
                    valueDecimals: 8
                }
            }],
            tooltip: {
                split: false,
                shared: true,
                useHTML: true,
                formatter: function(){
                    var me     = this,
                        tstamp = me.x,
                        ohlc   = false,
                        volume = false,
                        txt    = '<b>' + moment(tstamp).format('MMMM Mo YYYY HH:mm') + '</b><br>';
                    // Loop through points and extract data to usable vars
                    $.each(me.points, function(idx, item){
                        var x = item.series.index;
                        if(x==0) ohlc   = item.point;                    
                        if(x==1) volume = item.point.y;
                    });
                    txt += '<table class="highcharts-tooltip-table">';
                    if(volume){
                        txt += '<tr class="first"><td>Open</td><td class="separator">:</td><td class="text-right">' + formatAmount(bcformat(ohlc.open,8)) + '</td><td>' + XC.tick2 + '</td></tr>';
                        txt += '<tr><td>High</td><td class="separator">:</td><td class="text-right">' +  formatAmount(bcformat(ohlc.high,8)) + '</td><td>' + XC.tick2 + '</td></tr>';
                        txt += '<tr><td>Low</td><td class="separator">:</td><td class="text-right">' +  formatAmount(bcformat(ohlc.low,8)) + '</td><td>' + XC.tick2 + '</td></tr>';
                        txt += '<tr><td>Close</td><td class="separator">:</td><td class="text-right">' +  formatAmount(bcformat(ohlc.close,8)) + '</td><td>' + XC.tick2 + '</td></tr>';
                        txt += '<tr class="border-top-1"><td>Volume</td><td class="separator">:</td><td class="text-right">' + numeral(volume).format('0,0.00000000') + '</td><td>' + XC.tick1 + '</td></tr>';
                    }
                    txt += '</table>';
                    return txt;
                },
            },
        });

        // Handle restoring last known zoom level
        var sel = localStorage.getItem('marketChartZoom');
        if(sel)
            cfg.rangeSelector.selected = sel;

        // Initialize the chart
        try {
            Highcharts.stockChart('market-chart-candlestick', cfg);
        } catch (e){
            // Failover to simple line chart if we encounter any failures
            loadMarketChart('line');
        }
    }
}


// Handle updating the chart once the page has loaded
$(document).ready(function(){
    updateChart();
});
</script>
