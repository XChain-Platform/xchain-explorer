<!-- Line Chart -->
<div id="market-chart-line"></div>

<script type="text/javascript">

// Handle updating line chart
function updateChart(){

    // Get the trade data from XC.CHART_DATA
    var data = XC.CHART_DATA.trades;

    if(data){
        var maxTs = XCC.lastTimestamp(data.trades),
            range = XCC.normalizeRange(localStorage.getItem('marketChartZoom')),
            cfg   = XCC.lineConfig(data, { tick1: XC.tick1, tick2: XC.tick2 });

        XCC.applyRange(cfg, range, maxTs);

        XCC.render('market-chart-line', cfg, {
            name:          'market',
            height:        400,
            rangeSelector: true,
            range:         range,
            maxTs:         maxTs,
            noData:        'No Trades Found'
        });
    }
}

// Handle updating the chart once the page has loaded
$(document).ready(function(){
    updateChart();
});

</script>
