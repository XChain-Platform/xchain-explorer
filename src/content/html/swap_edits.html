<!-- Swap Edits (SWAP_EDIT: the owner amending a live swap in place) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-edit"></i> Swap Edits
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-swap_edit">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Source</th>
                        <th class="">Swap</th>
                        <th class="time">Expiration</th>
                        <th class="">Allow List</th>
                        <th class="">Block List</th>
                        <th class="">Memo</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="10" class="loading-data">Loading swap edit data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Swap Edits';
    XC.pageInfo.description = 'Live swaps amended in place by their owner (SWAP_EDIT) on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/swap_edits';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'swap_edit', null, null);

});
</script>
