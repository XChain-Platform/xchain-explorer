<!-- Contract Delegations (DELEGATE rows targeting a contract) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-key"></i> Contract Delegations
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-contract_delegation">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Source</th>
                        <th class="">Signing Pubkey</th>
                        <th class="">Contract</th>
                        <th class="">Tick</th>
                        <th class="block">Activation</th>
                        <th class="block">Deactivation</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="10" class="loading-data">Loading contract delegation data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Contract Delegations';
    XC.pageInfo.description = 'Stake delegations targeting a smart contract (DELEGATE) on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/contract_delegations';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'contract_delegation', null, null);

});
</script>
