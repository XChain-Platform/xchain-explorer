<!-- Dispenser -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-arrows-h"></i> Dispenser Information
                </div>
                <table class="table table-striped cell-border table-hover table-condensed no-bottom-margin" width="100%">
                <tbody>
                    <tr>
                        <th class="w-25">Address</th>
                        <td id="dispenser-address"></td>
                    </tr>
                    <tr>
                        <th class="w-25">Open Dispensers</th>
                        <td id="dispenser-open-count">0</td>
                    </tr>
                    <tr>
                        <th class="w-25">Dispenses</th>
                        <td id="dispenser-dispense-count">0</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-arrows-h"></i> Dispensers
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-dispenser">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Source</th>
                        <th class="">Dispensing</th>
                        <th class="">Cost</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="7" class="loading-data">Loading dispenser data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-hand-holding-heart"></i> Dispenses
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-dispense">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Destination</th>
                        <th class="">Dispensed</th>
                        <th class="">Paid</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="7" class="loading-data">Loading dispense data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    // Update the page with SEO friendly info
    XC.pageInfo.title       = 'Dispenser ' + XC.query;
    XC.pageInfo.description = 'Dispensers and dispenses for address ' + XC.query + ' on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/dispenser/' + XC.query;
    updatePageInfo();

    $('#dispenser-address').html(formatLink('/' + XC.coin + '/address/' + XC.query, XC.query));

    // Both tables are the SHIPPED dispenser/dispense feeds scoped to this
    // address, loaded through the same loadDatatablesData call the list pages
    // make. The `address` type is already registered on both routes, so this
    // page needs no new feed, no new route and no per-page render code - and it
    // inherits the positional createdRow handlers, which is why the two THEADs
    // above are copied column-for-column from dispensers.html / dispenses.html
    // rather than trimmed (a missing column misaligns every cell, XC render
    // lesson from the mints Destination column).
    loadDatatablesData(XC.coin, 'dispenser', XC.query, 'address');
    loadDatatablesData(XC.coin, 'dispense',  XC.query, 'address');

    // The counts come from the same feeds, asked for one row each, so the info
    // card can never disagree with the tables below it.
    $.getJSON('/' + XC.coin + '/explorer/dispensers/' + XC.query + '/address?length=1&start=0&draw=1', function(o){
        $('#dispenser-open-count').text(numeral(o && o.recordsTotal ? o.recordsTotal : 0).format('0,0'));
    });
    $.getJSON('/' + XC.coin + '/explorer/dispenses/' + XC.query + '/address?length=1&start=0&draw=1', function(o){
        $('#dispenser-dispense-count').text(numeral(o && o.recordsTotal ? o.recordsTotal : 0).format('0,0'));
    });

});
</script>
