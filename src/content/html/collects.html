<!-- Collects (validator reward claims) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-hand-holding-dollar"></i> Reward Claims
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-collect">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Source</th>
                        <th class="quantity">Amount</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6" class="loading-data">Loading reward claim data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Reward Claims';
    XC.pageInfo.description = 'Validator reward claims (COLLECT) on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/collects';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'collect', null, null);

});
</script>
