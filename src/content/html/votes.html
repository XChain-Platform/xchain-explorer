<!-- VOTE Ballots (token-weighted governance; votes table, VOTE v1) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-square-check"></i> Governance Ballots
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-vote">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Voter</th>
                        <th class="">Poll</th>
                        <th class="">Choice</th>
                        <th class="">Share</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="8" class="loading-data">Loading ballot data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    // Update the page with SEO friendly info
    XC.pageInfo.title       = 'VOTE Ballots';
    XC.pageInfo.description = 'Governance ballots cast on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network. Each row is one voter choice on a token-weighted poll.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/votes';
    updatePageInfo();

    // Load all `vote` actions
    loadDatatablesData(XC.coin, 'vote', null, null);

});
</script>
