version: '3.8'

# Pin the Compose project name. Without it Compose derives the project from this
# file's PARENT DIRECTORY, which is `fixtures`, a name any other repo laying its
# test compose out the same way also derives. That is not hypothetical: on
# 2026-07-30 the decoder tier, built by copying this very layout, ran `down -v`
# under the derived `fixtures` project and destroyed this file's container.
# The published 3307 makes the collision fatal rather than merely confusing,
# since two projects cannot both bind it.
#
# Bring this up through `npm run test:integration:up` (bin/db-fixture.js), never
# by calling docker compose directly: the wrapper refuses to start when a
# foreign server already holds 3307 and names the holder, instead of letting the
# DB tiers run against it and report an access-denied error that mentions
# neither the port nor the collision.
name: xchain-explorer-it

services:
  mariadb-test:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: testpass
      MARIADB_DATABASE: XChain_BTC_Regtest_Indexer
    ports:
      - "3307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 10
