<!-- Order Matches -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-handshake"></i> Order Matches
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-order_match">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="asset-name">Action</th>
                        <th class="">Details</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6" class="loading-data">Loading order match data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>


<script type="text/javascript">
$(document).ready(function() {

    // Update the page with SEO friendly info
    XC.pageInfo.title       = 'Order Matches';
    XC.pageInfo.description = 'Learn about ORDER_MATCH actions on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network - This page displays a list of order matches on the XChain platform';
    XC.pageInfo.canonical   = '/' + XC.coin + '/order_matches';
    updatePageInfo();

    // No /explorer/order_matches feed exists yet (order_matches only has a
    // non-DataTables /api lookup), so this reuses the history feed like the
    // Actions page; getActionDetails() already renders ORDER_MATCH rows with
    // their give/get legs when one appears in the mixed action stream.
    loadDatatablesData(XC.coin, 'order_match', null, null);

});
</script>
