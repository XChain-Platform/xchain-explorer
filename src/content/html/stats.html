<div class='container'>

    <div class="alert alert-info fade in center bold">This section is under active development</div>

    <div class="panel panel-primary">
        <div class="panel-heading panel-heading-lg">
            <i class="fa fa-line-chart fa-lg"></i> All Time Transaction History
        </div>
        <div class="panel-body center">
            <div id="allTime" style="min-width: 310px; height: 400px; margin: 0 auto"></div>
        </div>
    </div>

</div>

<script>

$(document).ready(function(){

    // Lookup stats
    $.getJSON('/stats/alltime_history', function (o){
        Highcharts.chart('allTime', {
            chart: {
                zoomType: 'x'
            },
            title: {
                text: 'All Time Transaction History'
            },
            // subtitle: {
            //     text: document.ontouchstart === undefined ?
            //             'Click and drag in the plot area to zoom in' : 'Pinch the chart to zoom in'
            // },
            xAxis: {
                type: 'datetime'
            },
            yAxis: {
                min: 0,
                title: {
                    text: '# of Transactions'
                }
            },
            legend: {
                enabled: false
            },
            plotOptions: {
                area: {
                    fillColor: {
                        linearGradient: {
                            x1: 0,
                            y1: 0,
                            x2: 0,
                            y2: 1
                        },
                        stops: [
                            [0, Highcharts.getOptions().colors[0]],
                            [1, Highcharts.Color(Highcharts.getOptions().colors[0]).setOpacity(0).get('rgba')]
                        ]
                    },
                    marker: {
                        radius: 2
                    },
                    lineWidth: 1,
                    states: {
                        hover: {
                            lineWidth: 1
                        }
                    },
                    threshold: null
                }
            },
            series: [{
                type: 'area',
                data: o.data
            }],
            tooltip: {
                useHTML: true,
                formatter: function(){
                    var dt   = this.x,
                        rec = false,
                        txt = '<center><b>' + moment(dt).format("MM/DD/YYYY") + '</b>';
                    o.data.forEach(function(item){
                        if(item[0]==dt)
                            rec = item;
                    });
                    txt += '<table border=0>';
                    rec[2].split('|').forEach(function(item,idx){
                        var type = o.types[idx+1];
                        type = type.substr(0,1).toUpperCase() + type.substr(1);
                        if(item!='0')
                            txt += '<tr><td align="right">' + numeral(item).format('0,0') + '</td><td>&nbsp;' + type + '</td></tr>';
                    });
                    txt += '<tr><td align="right"><b>' + numeral(this.y).format('0,0') + '</b></td><td><b>&nbsp;Total</b></td></tr>';
                    txt += '</table></center>';
                    // console.log('txt=',txt);
                    // Ext.each(o.data, 
                    // console.log('this=',this);
                    // return 'The value for <b>' + this.x + '</b> is <b>' + this.y + '</b>, in series '+ this.series.name;
                    return txt;
                }
            }
        });
    });

});
</script>
