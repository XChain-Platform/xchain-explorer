<!-- History -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-clock"></i> Recent History
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-history">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="asset-name">Action</th>
                        <th class="">Details</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6" class="loading-data">Loading history data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>


<script type="text/javascript">
$(document).ready(function() {

    // Update the page with SEO friendly info
    XC.pageInfo.title       = 'Action History';
    XC.pageInfo.description = 'Learn about the action history on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network — This page displays a list of historic actions on the XChain platform';
    XC.pageInfo.canonical   = '/' + XC.coin + '/history';
    updatePageInfo();

    // Load all `history` actions
    loadDatatablesData('BTC', 'history', null, 'recent');

});
</script>
