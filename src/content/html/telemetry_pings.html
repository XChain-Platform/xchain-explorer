<!-- Telemetry Pings (hub-owned `telemetry_pings`, read from the co-located hub DB) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-satellite-dish"></i> Node Telemetry
                </div>
                <table class="table table-striped cell-border table-hover table-condensed" width="100%" id="datatable-telemetry_ping">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="time">Time</th>
                        <th class="">Event</th>
                        <th class="">Node Version</th>
                        <th class="">Platform</th>
                        <th class="">Arch</th>
                        <th class="">Location</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="7" class="loading-data">Loading node telemetry data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Node Telemetry';
    XC.pageInfo.description = 'Anonymous xchain-node telemetry pings reported to the XChain hub on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/telemetry_pings';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'telemetry_ping', null, null);

});
</script>
