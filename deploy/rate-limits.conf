; Drop-in for the explorer unit's .service.d directory pinning all nine of the
; explorer's origin rate limits. Like tbtc-tip-gates.conf beside it, and unlike
; a deployment's own endpoint drop-ins, this one is POLICY, so it is
; version-controlled here.
;
; Why the numbers are written out even where they equal the code default: a
; deployment's limits must not depend on which explorer build happens to be
; installed. A default that moves in a later release would otherwise change
; behaviour silently, on a restart nobody associates with a limit change. All
; nine are listed for that reason, the five unchanged ones included.
;
; Where they come from: the measured five-address wallet profile (cold open plus
; the polls that fit the same 60-second window), x2 for the SDK's single retry
; and x3 for headroom, because a NAT with three testers shares one bucket. These
; are per real client address, so they assume the origin resolves the visitor
; behind any proxy in front of it; where it does not, one bucket is shared by
; everyone arriving through the same proxy address and the profile does not
; apply.
;
; Three of the nine were raised by that derivation: the app-wide limit, the
; action/balance proof limiter and the checkpoint-verify limiter. The other five
; are not on an idle wallet's path, the profile does not exercise them, and they
; carry their shipped values unchanged.
;
; EXPLORER_BATCH_RATE_LIMIT_RPM bounds the two batch POSTs together (balances and
; coinpay_obligations share one bucket, because a wallet's balance beat and its
; coinpay badge are two callers of one wallet). 72 comes from the same profile: 3
; chains x (1 cold open + 2 further polls) balance batches + 3 x 1 coinpay batch =
; 12 per client per minute, x2 for the SDK's single retry and x3 for headroom.
;
; The batch routes have landed and the same profile, driven through them,
; derives app-wide 180 (a worst minute of 30 requests: 15 proof, 12 batch, 3
; checkpoint-verify), action-proof 90 unchanged, checkpoint-verify back to its
; shipped 60 (18 required once the SDK caches the validator set) and batch 72.
; The three numbers above the batch line are NOT moved yet on purpose: a
; released wallet that still reads per address needs the 1080/90/90 room, and
; lowering them refuses that wallet behind a shared address. They move down,
; here and in the source defaults together, once a wallet release carrying the
; batch reads is what users run.

[Service]
Environment=EXPLORER_RATE_LIMIT_RPM=1080
Environment=EXPLORER_ACTION_PROOF_RATE_LIMIT_RPM=90
Environment=EXPLORER_CHECKPOINT_VERIFY_RATE_LIMIT_RPM=90
Environment=EXPLORER_FEE_QUOTE_RATE_LIMIT_RPM=120
Environment=EXPLORER_PREFLIGHT_POST_RATE_LIMIT_RPM=60
Environment=EXPLORER_CHECKPOINT_LIST_RATE_LIMIT_RPM=120
Environment=EXPLORER_VALIDATOR_SET_PROOF_RATE_LIMIT_RPM=30
Environment=EXPLORER_VM_QUERY_RATE_LIMIT_RPM=20
Environment=EXPLORER_BATCH_RATE_LIMIT_RPM=72
