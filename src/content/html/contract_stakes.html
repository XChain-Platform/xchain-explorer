<!-- Contract Stakes -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-lock"></i> Contract Stakes
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-contract_stake">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Source</th>
                        <th class="">Signing Pubkey</th>
                        <th class="">Contract</th>
                        <th class="token">Token</th>
                        <th class="quantity">Amount</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="9" class="loading-data">Loading contract stake data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Contract Stakes';
    XC.pageInfo.description = 'Token stakes targeting smart contracts (STAKE v3) on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/contract_stakes';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'contract_stake', null, null);

});
</script>
