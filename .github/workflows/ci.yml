# FINAL - the slim per-repo replacement for .github/workflows/ci.yml
# Drop this into each npm repo. It does nothing but delegate to the shared definition.
# Pinned to a commit SHA (not @master) so a change to the shared reusable workflow
# only reaches this repo when the SHA is bumped deliberately. See the uses: line below.
name: CI

# Least privilege for the default GITHUB_TOKEN: every job here only reads the repo.
permissions:
  contents: read

on:
  push:
    # develop is where all work lands; master only ever receives release PRs.
    # Both run the gate: develop so a lane push is verified as it lands, master
    # so the merge commit a release tag points at has its own green run.
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  ci:
    uses: XChain-Platform/.github/.github/workflows/ci-reusable.yml@6f4d39ae85787fc31e90a31588d87610a2c33103 # pin: XChain-Platform/.github @ master 2026-08-14; bump deliberately
    # Override the Node version for a repo if ever needed:
    # with:
    #   node-version: "20"

  # Dedicated perf job with a real MariaDB. A caller cannot inject a `services:`
  # container into the reusable (workflow_call) `ci` job above, so the perf suite
  # (which boots the explorer against MariaDB on 3307) runs here instead. Same
  # rationale as the hub perf job. testpass / port 3307 match the committed
  # test/integration/fixtures/docker-compose.test.yml the suite was built against,
  # so there is no new credential literal. The perf setup takes the sanctioned
  # ALLOW_NO_COLOCATED_HUB_DB bypass itself (no checkpoint schema in the fixture).
  perf:
    # Only spend the perf runtime once the unit gate is green.
    needs: ci
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: testpass
          MARIADB_DATABASE: XChain_BTC_Regtest_Indexer
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run performance suite
        run: npm run test:performance

  # Dedicated integration job with a real MariaDB (same reasoning + fixture creds
  # as the perf job above: the reusable ci job cannot inject a services container).
  # bin/run-integration.sh runs each integration file in its own process because
  # the files use root-level before/after hooks that otherwise cross-corrupt in a
  # single mocha run. nft-endpoints creates a colocated decoder DB, so the root
  # user (which has CREATE DATABASE) is used, matching the fixture.
  integration:
    # Only spend the integration runtime once the unit gate is green.
    needs: ci
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: testpass
          MARIADB_DATABASE: XChain_BTC_Regtest_Indexer
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration suite
        run: npm run test:integration

  # Real-schema conformance canary: loads the REAL indexer (and
  # decoder, when present) DDL into a real MariaDB and executes every routed
  # db.js read path plus the ChangeDetector WS poll loop against it. This is
  # the always-on systemic catch for a schema-drift class (a SELECT
  # of a non-existent column shipping green because unit tests stub the DB
  # and the integration tier runs on a fixture snapshot). Needs the sibling
  # xchain-indexer checkout (same deploy-key pattern as drift-guards below);
  # runs from the explorer checkout so relative ../xchain-indexer resolves
  # like the platform monorepo layout.
  conformance:
    needs: ci
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: testpass
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          path: xchain-explorer

      - name: Check out the real indexer DDL (xchain-indexer)
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-indexer
          ssh-key: ${{ secrets.XCHAIN_INDEXER_DEPLOY_KEY }}
          path: xchain-indexer

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: xchain-explorer/package-lock.json

      - name: Install dependencies
        working-directory: xchain-explorer
        run: npm ci

      - name: Run schema-conformance canary
        working-directory: xchain-explorer
        run: npm run test:conformance

  # Cross-repo drift guards: this repo vendors the canonical
  # coin registry from xchain-hub, and per-repo CI cannot see sibling repos, so
  # a drifted vendored copy previously shipped green (the byte-identity checks
  # ran only in the monorepo's manual bin/ci-all.sh). This job recreates the
  # sibling layout (self + canonical side by side) and runs the same checks.
  # The canonical repo is private pre-launch, so its checkout uses a read-only
  # deploy key; drop the ssh-key line when the repos flip public at launch.
  drift-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: xchain-explorer

      - name: Check out the canonical coin registry (xchain-hub)
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-hub
          ssh-key: ${{ secrets.XCHAIN_HUB_DEPLOY_KEY }}
          path: xchain-hub

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Coin-registry byte-identity vs canonical
        run: xchain-hub/bin/sync-coins.sh --check --only xchain-explorer

      - name: Coin consensus-pin conformance (own vendored bundle)
        working-directory: xchain-explorer
        run: |
          node -e '
            const coins = require("./src/coins");
            for (const net of ["testnet", "regtest"]) {
              const res = coins.verifyConsensusPin(net);
              if (res && res.skipped) throw new Error("consensus pin unexpectedly unarmed for " + net);
            }
            console.log("consensus pin conformance OK (testnet, regtest)");
          '

      # The explorer also embeds the hub-DB mirror client (hub_db_sync.js,
      # hub-schema-version.js, the mirror-table SQL twins), canonical in
      # xchain-indexer. Same drift class, same fix: byte-compare vs a checkout
      # of the canonical repo.
      - name: Check out the canonical hub-mirror client (xchain-indexer)
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-indexer
          ssh-key: ${{ secrets.XCHAIN_INDEXER_DEPLOY_KEY }}
          path: xchain-indexer

      - name: Hub-mirror-client byte-identity vs canonical
        run: xchain-indexer/bin/sync-hub-mirror-client.sh --check

  # Coverage ratchet: re-run the unit suite under c8 and fail if line or
  # branch coverage drops below this repo's floor in bin/coverage-thresholds.json
  # (mirrored into the `coverage:check` npm script). Catches silent coverage
  # regression the pass/fail gate cannot see: a change that keeps every test green
  # while deleting the only test that reached a file. These are RATCHET FLOORS
  # (~1-1.5 points below measured), not tier targets; raise them as coverage climbs.
  coverage:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The ratchet re-runs the unit suite, so it needs the same siblings the gate
      # gets. Without them the guards that read a sibling skip silently, so the
      # ratchet measures a suite the gate never ran: 2423 of 2504 unit tests ran without them.
      # Same roster (.ci-siblings) and same layout the shared workflow uses.
      - name: Check out declared sibling repositories
        env:
          SIBLINGS_REF: ${{ github.ref == 'refs/heads/master' && 'master' || 'develop' }}
        run: |
          set -euo pipefail
          repos=$(sed 's/#.*//' .ci-siblings | tr -d '\r' | awk 'NF')
          cd "$GITHUB_WORKSPACE/.."
          for repo in $repos; do
            rm -rf "$repo"
            url="https://github.com/${{ github.repository_owner }}/$repo.git"
            git clone --quiet --depth 1 --branch "$SIBLINGS_REF" "$url" "$repo" 2>/dev/null \
              || git clone --quiet --depth 1 "$url" "$repo"
            echo "sibling $repo @ $(git -C "$repo" rev-parse --abbrev-ref HEAD) $(git -C "$repo" rev-parse --short HEAD)"
            if [ -f "$repo/package.json" ]; then
              ( cd "$repo" && npm ci --omit=dev --ignore-scripts --no-audit --no-fund >/dev/null 2>&1 ) \
                || ( cd "$repo" && npm install --omit=dev --ignore-scripts --no-audit --no-fund >/dev/null 2>&1 ) \
                || echo "sibling $repo: dependency install failed"
            fi
          done

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Coverage thresholds (c8 --check-coverage)
        run: npm run coverage:check
