<!-- Deposits -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-arrow-down"></i> Deposits
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-deposit">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Source</th>
                        <th class="">Contract</th>
                        <th class="token">Token</th>
                        <th class="quantity">Amount</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="8" class="loading-data">Loading deposit data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Contract Deposits';
    XC.pageInfo.description = 'Token deposits into smart contract custody on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/deposits';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'deposit', null, null);

});
</script>
