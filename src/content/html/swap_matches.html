<!-- Swap Matches -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-right-left"></i> Swap Matches
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-swap_match">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="">Give Swap</th>
                        <th class="">Get Swap</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6" class="loading-data">Loading swap match data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>


<script type="text/javascript">
$(document).ready(function() {

    // Update the page with SEO friendly info
    XC.pageInfo.title       = 'Swap Matches';
    XC.pageInfo.description = 'Learn about SWAP_MATCH actions on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network - This page displays a list of swap matches on the XChain platform';
    XC.pageInfo.canonical   = '/' + XC.coin + '/swap_matches';
    updatePageInfo();

    // Served by the real /explorer/swap_matches feed. Each leg names its coin
    // plus the matched SWAP's action index (a match row carries no ticks or
    // amounts), so the table links the two swaps rather than token pages.
    loadDatatablesData(XC.coin, 'swap_match', null, null);

});
</script>
