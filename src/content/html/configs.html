<!-- Configs (hub-owned `configs` config oracle, read from the co-located hub DB) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-sliders"></i> Config Oracle
                </div>
                <table class="table table-striped cell-border table-hover table-condensed" width="100%" id="datatable-config">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="time">Updated</th>
                        <th class="">Coin</th>
                        <th class="">Network</th>
                        <th class="">Module</th>
                        <th class="">Parameter</th>
                        <th class="">Value</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="7" class="loading-data">Loading config oracle data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Config Oracle';
    XC.pageInfo.description = 'Hub config-oracle parameters distributed across the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/configs';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'config', null, null);

});
</script>
