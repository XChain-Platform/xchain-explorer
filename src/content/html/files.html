<!-- Files -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-file"></i> Files
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-file">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Source</th>
                        <th class="">Name</th>
                        <th class="">Type</th>
                        <th class="">Title</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="8" class="loading-data">Loading file data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {


    // Update the page with SEO friendly info
    XC.pageInfo.title       = 'FILE Actions';
    XC.pageInfo.description = 'Learn about the FILE actions on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network — This page displays a list of FILE actions on the XChain platform';
    XC.pageInfo.canonical   = '/' + XC.coin + '/files';
    updatePageInfo();

    // Load all `file` actions
    loadDatatablesData(XC.coin, 'file', null, null);

});
