<!-- Dispenser Cancellations (DISPENSER_CANCEL: the owner withdrawing a dispenser) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-times"></i> Dispenser Cancellations
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-dispenser_cancel">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Source</th>
                        <th class="">Dispenser</th>
                        <th class="">Memo</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="7" class="loading-data">Loading dispenser cancellation data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Dispenser Cancellations';
    XC.pageInfo.description = 'Dispensers withdrawn by their owner (DISPENSER_CANCEL) on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/dispenser_cancels';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'dispenser_cancel', null, null);

});
</script>
