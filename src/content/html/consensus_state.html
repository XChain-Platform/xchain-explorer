<!-- Consensus State (hub-owned `consensus_state`, read from the co-located hub DB) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-diagram-project"></i> Consensus State
                </div>
                <table class="table table-striped cell-border table-hover table-condensed" width="100%" id="datatable-consensus_state">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="time">Updated</th>
                        <th class="">Key</th>
                        <th class="">Value</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="4" class="loading-data">Loading consensus state data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Consensus State';
    XC.pageInfo.description = 'Hub consensus key/value state on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/consensus_state';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'consensus_state', null, null);

});
</script>
