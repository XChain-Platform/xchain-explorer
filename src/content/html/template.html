<!DOCTYPE html>
<html class="no-js" lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>XChain Platform Explorer</title>

    <!-- Meta Tags -->
    <meta name="description" content="Explore tokens, actions, addresses and blocks across every chain the XChain protocol runs on: Bitcoin, Litecoin and Dogecoin.">
    <meta name="robots"      content="index, follow">
    <meta name="viewport"    content="width=device-width, initial-scale=1.0">

    <!-- Canonical URL -->
    <link rel="canonical"  href="" />

    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="XChain" />
    <meta property="og:locale"      content="en_US" />
    <meta property="og:url"         content="" />
    <meta property="og:title"       content="XChain Platform Explorer" />

    <meta property="og:image"       content="https://xchain.io/og/site/explorer.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"   content="XChain Platform Explorer" />
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@xchain_io" />
    <meta name="twitter:title"       content="XChain Platform Explorer" />
    <meta name="twitter:description" content="Explore tokens, actions, addresses and blocks across every chain the XChain protocol runs on: Bitcoin, Litecoin and Dogecoin." />

    <link type="text/css"  rel="stylesheet" href="/css/xchain.css">

    <!-- First of the first-party scripts: the four below log through the XCLogger it defines. -->
    <script type="text/javascript" src="/js/browser_logger.js"></script>
    <!-- Ahead of xchain.js on purpose: formatters.js owns the cell-rendering helpers
         xchain.js used to declare itself, and components.js owns the registry the
         mount manifest at the foot of a composed page is handed to. -->

    <script type="text/javascript" src="/js/formatters/protocol.js"></script>

         mounts until xchain.js's ready handler reads the page's manifest, which
         is the first point at which the coin/network context exists. -->

<body class="d-flex flex-column min-vh-100">

    <!-- Header -->
{NAV}

    <!-- Freshness banner, shown by updateFreshnessBanner() (xchain.js) while this
         coin's indexed tip is behind. Every table and card on the page still
         renders from the database; this only says how far behind it is. -->
    <div class="container" id="freshness-banner" style="display:none;">
        <div class="alert alert-warning text-center mt-3 mb-0" role="status" aria-live="polite">
            <strong>Data on this site is delayed.</strong> <span id="freshness-banner-text"></span>
        </div>
    </div>

    {CONTENT}

    <!-- Footer -->
{FOOTER}
