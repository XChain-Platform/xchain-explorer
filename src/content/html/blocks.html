<!-- Blocks -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-cube"></i> Blocks
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-block">
                <thead>
                    <tr class="info">
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th>Transactions</th>

                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="4" class="loading-data">Loading block data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    // Update the page with SEO friendly info
    XC.pageInfo.title       = 'Blocks';
    XC.pageInfo.description = 'Learn about the blocks on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network — This page displays a list of blocks on the XChain platform';
    XC.pageInfo.canonical   = '/' + XC.coin + '/blocks';
    updatePageInfo();

    // Load all `block` actions
    loadDatatablesData('BTC', 'block', null, null);

});
</script>
