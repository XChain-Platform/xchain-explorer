<!-- Executions -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-play"></i> Executions
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-execution">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="">Contract</th>
                        <th class="address">Caller</th>
                        <th class="">Method</th>
                        <th class="quantity">Gas Used</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="8" class="loading-data">Loading execution data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Contract Executions';
    XC.pageInfo.description = 'Smart contract method executions on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/executions';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'execution', null, null);

});
</script>
