<!-- Oracle Prices (user token/fiat PRICE v1, hub-mirrored) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-chart-line"></i> Oracle Prices
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-oracle_price">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="time">Time</th>
                        <th class="">Chain</th>
                        <th class="address">Source</th>
                        <th class="token">Token</th>
                        <th class="">Fiat</th>
                        <th class="quantity">Value</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="7" class="loading-data">Loading oracle price data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Oracle Prices';
    XC.pageInfo.description = 'User-published token/fiat oracle prices (PRICE v1) on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/oracle_prices';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'oracle_price', null, null);

});
</script>
