<!-- Swaps -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-exchange"></i> Swaps
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-swap">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Source</th>
                        <th class="token">Give Token</th>
                        <th class="quantity">Give Amount</th>
                        <th class="token">Get Token</th>
                        <th class="quantity">Get Amount</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="9" class="loading-data">Loading swap data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    // Update the page with SEO friendly info
    XC.pageInfo.title       = 'SWAP Actions';
    XC.pageInfo.description = 'Learn about the SWAP actions on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network - This page displays a list of SWAP actions on the XChain platform';
    XC.pageInfo.canonical   = '/' + XC.coin + '/swaps';
    updatePageInfo();

    // Load all `swap` actions
    loadDatatablesData(XC.coin, 'swap', null, null);

});
</script>
