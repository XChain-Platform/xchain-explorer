<!-- Coinpay Expirations (COINPAY_EXPIRE: an unpaid obligation closed out at its expiration) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-hourglass-end"></i> Coinpay Expirations
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-coinpay_expire">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="">Obligation</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="5" class="loading-data">Loading coinpay expiration data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Coinpay Expirations';
    XC.pageInfo.description = 'Cross-chain obligations that went unpaid and were closed out at their expiration (COINPAY_EXPIRE) on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/coinpay_expires';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'coinpay_expire', null, null);

});
</script>
