<!-- Attestations -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-certificate"></i> Attestations
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-attestation">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Source</th>
                        <th class="">Type</th>
                        <th class="">Provider</th>
                        <th class="">Request ID</th>
                        <th class="">Status</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="9" class="loading-data">Loading attestation data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    // Update the page with SEO friendly info
    XC.pageInfo.title       = 'ATTEST Actions';
    XC.pageInfo.description = 'Learn about the ATTEST actions on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network - This page displays external-data attestation requests and validator responses.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/attestations';
    updatePageInfo();

    // Load all `attestation` actions
    loadDatatablesData(XC.coin, 'attestation', null, null);

});
</script>
