<!-- Validator Rewards -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-coins"></i> Validator Rewards
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-reward">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Source</th>
                        <th class="">Signing Pubkey</th>
                        <th class="">Reward Type</th>
                        <th class="quantity">Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="7" class="loading-data">Loading validator reward data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Validator Rewards';
    XC.pageInfo.description = 'Accrued validator rewards (oracle, anchor, attestation, full-node) on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/rewards';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'reward', null, null);

});
</script>
