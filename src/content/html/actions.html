<!-- Actions -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-bolt"></i> All Actions
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-action">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="">Source</th>
                        <th class="asset-name">Action</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6" class="loading-data">Loading action data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>


<script type="text/javascript">
$(document).ready(function() {

    // Update the page with SEO friendly info
    XC.pageInfo.title       = 'All Actions';
    XC.pageInfo.description = 'Browse every action recorded on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network - This page displays a raw list of every action type on the XChain platform';
    XC.pageInfo.canonical   = '/' + XC.coin + '/actions';
    updatePageInfo();

    // Served by the raw /explorer/actions feed: one row per action with its
    // source and type name. Per-type details live on each action's own page,
    // which keeps this list cheap (no per-type detail joins).
    loadDatatablesData(XC.coin, 'action', null, null);

});
</script>
