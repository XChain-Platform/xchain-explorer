<!-- Latest Bets -->
<div class="row">
    <div class="col-sm-12">
        <div class="panel panel-primary table-responsive">
            <div class="panel-heading panel-heading-lg">
                <i class="fa fa-lg fa-trophy"></i> Bets
            </div>
            <table class="table table-striped cell-border table-hover table-condensed" width="100%">
            <thead>
                <tr class="info">
                    <th class="record">#</th>
                    <th class="block">Block</th>
                    <th class="time">Time</th>
                    <th class="address">Source</th>
                    <th class="">Type</th>
                    <th class="">Value</th>
                    <th class="">Wager</th>
                    <th class="">Counterwager</th>
                    <th class="view"></th>
                </tr>
            </thead>
            <tbody>
            </tbody>
            </table>
        </div>
    </div>
</div>

<script type="text/javascript">

    // Define array of bet types
    var bet_types = [];
    bet_types[0] = 'Bullish'; // CFD (deprecated), 
    bet_types[1] = 'Bearish'; // CFD (deprecated), 
    bet_types[2] = 'Equal';
    bet_types[3] = 'Not Equal';


    $(document).ready(function() {

        // Array to some misc values used for tracking offset and direction
        var misc = [];
        misc['last_start'] = 0;

        // Keep track of records per page
        var sm   = localStorage,
            rec  = sm.getItem('records_per_page_bets');
            page = (rec) ? parseInt(rec) : 10;

        // Detect any 'per page' changes and save to localStorage
        $('.table').on( 'length.dt', function ( e, settings, length ){
            sm.setItem('records_per_page_bets',length);
        });    

        $('.table').dataTable({
            ajax: {
                url: "/explorer/bets",
                data: function(data){
                    // Pass action and offset with request
                    var action = null,
                        offset = null;
                    if(data.start==0){
                        action = 'first';
                    } else if(data.start > (misc['last_start'] + data.length)){
                        action = 'last';
                    } else if(data.start >= misc['last_start']){
                        action = 'next';
                        offset = misc['offset_last'];
                    } else {
                        action = 'prev';
                        offset = misc['offset_first'];
                    }
                    // Pass action and offset forward
                    data.action = action;
                    data.offset = offset;
                    // pass total back to server (used to quickly calculate how many records to display on 'last' page)
                    data.total =  misc['total'];
                    // Cleanup the request so we only send what we need
                    delete data.columns;
                    delete data.order;
                    delete data.search;
                    delete data.draw;
                }                
            },
            pageLength: page,
            dom: '<"search-options center"<"pull-left hidden-xs"l>p<"pull-right hidden-xs"i>><"search-results"t>',
            pagingType: "full",
            serverSide: true,
            searching: false,
            ordering: false,
            processing: true,
            autoWidth: false,
            language: {
                lengthMenu: "_MENU_ per page",
                zeroRecords: "No records found",
                info: "_TOTAL_ results",
                // info: "Displaying _START_ - _END_ of _TOTAL_",
                infoEmpty: "No records available",
                paginate: {
                    first: "<i class='fa fa-chevron-left'></i><i class='fa fa-chevron-left'></i>",
                    previous: "<i class='fa fa-chevron-left'></i>",
                    next: "<i class='fa fa-chevron-right'></i>",
                    last: "<i class='fa fa-chevron-right'></i><i class='fa fa-chevron-right'></i>"
                }
            },
            fnDrawCallback: function( o ){
                var total  = o._iRecordsTotal,
                    length = o._iDisplayLength,
                    stop   = o._iDisplayStart + length,
                    page   = stop / length,
                    pages  = total / length;
                if(pages > parseInt(pages))
                    pages = parseInt(pages) + 1;
                // Add 'Page X of Y' in between previous/next buttons
                $('.paginate_button.previous').after('&nbsp;&nbsp;Page ' + numeral(page).format('0,0') + ' of ' + numeral(pages).format('0,0') + '&nbsp;&nbsp;')
                // Track first and last shown tx_index (used for offset tracking)
                if(o.json.data && o.json.data.length){
                    var first = o.json.data[0],
                        last  = o.json.data[o.json.data.length-1];
                    misc['offset_first'] = first[first.length-1];
                    misc['offset_last']  = last[last.length-1];
                } else {
                    misc['offset_first'] = 0;
                    misc['offset_last']  = 0;
                }
                // Save the start so we can determine direction when user clicks (prev/next)
                misc['last_start'] = o._iDisplayStart;
                // Save total, so we can pass back in API requests (used to calculate how many records to display on 'last' page)
                misc['total'] = o.json.recordsTotal;
            },
            createdRow: function(row, data, idx){
                $('td', row).eq(0).html(numeral(data[0]).format('0,0'));
                $('td', row).eq(1).html('<a href="/block/' + data[1] + '">' + numeral(data[1]).format('0,0') + '</a>');
                $('td', row).eq(2).html('<span data-livestamp='  + data[2] + ' class="nowrap"></span>');
                $('td', row).eq(3).html('<a href="/address/' + data[3] + '">' + data[3] + '</a>');
                $('td', row).eq(4).html(bet_types[data[5]]);
                $('td', row).eq(5).html(data[6]);
                $('td', row).eq(6).html(numeral(data[7]).format('0,0.00000000'));
                $('td', row).eq(7).html(numeral(data[8]).format('0,0.00000000'));
                $('td', row).eq(8).html('<a href="/tx/' + data[9] + '" class="btn btn-xs btn-success pull-right">view</a>');
            }
        });

    });
</script>
