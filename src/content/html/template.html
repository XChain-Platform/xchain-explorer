<!DOCTYPE html>
<html class="no-js" lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>XChain Platform Explorer</title>

    <!-- Meta Tags -->
    <meta name="description" content="Explore tokens, actions, addresses and blocks across every chain the XChain protocol runs on: Bitcoin, Litecoin and Dogecoin.">
    <meta name="robots"      content="index, follow">
    <meta name="viewport"    content="width=device-width, initial-scale=1.0">

    <!-- Canonical URL -->
    <link rel="canonical"  href="" />

    <!-- Social cards. Defaults here; updatePageInfo() rewrites url/title/description per page. -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="XChain" />
    <meta property="og:locale"      content="en_US" />
    <meta property="og:url"         content="" />
    <meta property="og:title"       content="XChain Platform Explorer" />
    <meta property="og:description" content="Explore tokens, actions, addresses and blocks across every chain the XChain protocol runs on: Bitcoin, Litecoin and Dogecoin." />
    <meta property="og:image"       content="https://xchain.io/og/site/explorer.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"   content="XChain Platform Explorer" />
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@xchain_io" />
    <meta name="twitter:title"       content="XChain Platform Explorer" />
    <meta name="twitter:description" content="Explore tokens, actions, addresses and blocks across every chain the XChain protocol runs on: Bitcoin, Litecoin and Dogecoin." />
    <meta name="twitter:image"       content="https://xchain.io/og/site/explorer.jpg" />

    <!-- CSS and icon Includes -->
    <link type="image/ico" rel="icon"       href="/images/favicon.ico">
    <link type="text/css"  rel="stylesheet" href="/css/bootstrap.min.css">
    <link type="text/css"  rel="stylesheet" href="/css/jquery.dataTables.min.css">
    <link type="text/css"  rel="stylesheet" href="/themes/classic/tokens.css">
    <link type="text/css"  rel="stylesheet" href="/css/xchain-charts.css">
    <link type="text/css"  rel="stylesheet" href="/css/swagger-ui.css" />
    <link type="text/css"  rel="stylesheet" href="/css/highlight-github.min.css">
    <link type="text/css"  rel="stylesheet" href="/fontawesome/css/all.min.css">
    <link type="text/css"  rel="stylesheet" href="/fontawesome/css/v4-shims.min.css">
    <link type="text/css"  rel="stylesheet" href="/css/xchain.css">
    <!-- Component stylesheets. After xchain.css so a component can refine what the
         page-level sheet set, and tokens-only by gate (theme-token-literal-gate). -->
    <link type="text/css"  rel="stylesheet" href="/components/data-table/component.css">
    <link type="text/css"  rel="stylesheet" href="/components/stat-card/component.css">
    <link type="text/css"  rel="stylesheet" href="/components/detail-card/component.css">
    <link type="text/css"  rel="stylesheet" href="/components/tab-panel/component.css">
    <link type="text/css"  rel="stylesheet" href="/components/qr-card/component.css">
    <link type="text/css"  rel="stylesheet" href="/components/chart/component.css">
    <link type="text/css"  rel="stylesheet" href="/components/nav/component.css">
    <link type="text/css"  rel="stylesheet" href="/components/search-box/component.css">
    <link type="text/css"  rel="stylesheet" href="/components/footer/component.css">
    <link type="text/css"  rel="stylesheet" href="/components/theme-toggle/component.css">

    <!-- Javascript Includes -->
    <script type="text/javascript" src="/js/jquery.min.js"></script>
    <script type="text/javascript" src="/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="/js/jquery.dataTables.js"></script>
    <!-- Ahead of xchain.js on purpose: formatters.js owns the cell-rendering helpers
         xchain.js used to declare itself, and components.js owns the registry the
         mount manifest at the foot of a composed page is handed to. -->
    <script type="text/javascript" src="/js/formatters.js"></script>
    <script type="text/javascript" src="/js/components.js"></script>
    <script type="text/javascript" src="/js/xchain.js"></script>
    <script type="text/javascript" src="/js/xchain-ws.js"></script>

    <!-- Components. Each registers itself with XCComponents on load; nothing
         mounts until xchain.js's ready handler reads the page's manifest, which
         is the first point at which the coin/network context exists. -->
    <script type="text/javascript" src="/components/data-table/columns.js"></script>
    <script type="text/javascript" src="/components/data-table/init.js"></script>
    <script type="text/javascript" src="/components/stat-card/init.js"></script>
    <script type="text/javascript" src="/components/detail-card/init.js"></script>
    <script type="text/javascript" src="/components/tab-panel/init.js"></script>
    <script type="text/javascript" src="/components/qr-card/init.js"></script>
    <script type="text/javascript" src="/components/chart/init.js"></script>
    <script type="text/javascript" src="/components/nav/init.js"></script>
    <script type="text/javascript" src="/components/search-box/init.js"></script>
    <script type="text/javascript" src="/components/footer/init.js"></script>
    <script type="text/javascript" src="/components/theme-toggle/init.js"></script>
</head> 
<body class="d-flex flex-column min-vh-100">

    <!-- Header -->
{NAV}

    <!--
    <div class="container">
        <div class="alert alert-primary text-center mt-3 mb-0" role="alert">
           This site is currently under development and some of the features defined may not be fully functioning yet.<br> 
           Thank you for your patience as we build out this site to realize the full potential of the <a href="https://xchain.io" target="_blank">XChain Platform</a>.
        </div>
    </div>
    -->

    {CONTENT}

    <!-- Footer -->
{FOOTER} 




    <!-- Load additional javascript assets -->
    <script type="text/javascript" src="/js/moment.min.js"></script>
    <script type="text/javascript" src="/js/livestamp.min.js"></script>
    <script type="text/javascript" src="/js/numeral.js"></script>
    <script type="text/javascript" src="/js/math.min.js"></script>
    <script type="text/javascript" src="/js/chart.umd.js"></script>
    <script type="text/javascript" src="/js/chartjs-adapter-moment.js"></script>
    <script type="text/javascript" src="/js/chartjs-chart-financial.js"></script>
    <script type="text/javascript" src="/js/xchain-charts.js"></script>
    <script type="text/javascript" src="/js/jquery.qrcode.min.js"></script>
    <script type="text/javascript" src="/js/throttle-debounce-fn.min.js"></script>
    <script type="text/javascript" src="/js/highlight.min.js"></script>

</body>
</html>
