<!-- Addresses -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-gears"></i> Addresses
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-address">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Source</th>
                        <th class="">Fee Preference</th>
                        <th class="">Require Memo</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="7" class="loading-data">Loading address data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $(document).ready(function() {

        // Update the page with SEO friendly info
        XC.pageInfo.title       = 'ADDRESS Actions';
        XC.pageInfo.description = 'Learn about the ADDRESS actions on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network - This page displays a list of ADDRESS actions on the XChain platform';
        XC.pageInfo.canonical   = '/' + XC.coin + '/addresses';
        updatePageInfo();

        // Load all `address` actions
        loadDatatablesData(XC.coin, 'address', null, null);

    });
</script>
