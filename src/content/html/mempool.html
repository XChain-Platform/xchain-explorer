<!-- Latest Unconfirmed Transactions -->
<div class="row">
    <div class="col-sm-12">
        <div class="panel panel-primary table-responsive">
            <div class="panel-heading panel-heading-lg">
                <i class="fa fa-lg fa-clock-o"></i> Mempool - Unconfirmed Transactions
            </div>
            <table class="table table-striped cell-border table-hover table-condensed" width="100%">
            <thead>
                <tr class="info">
                    <th class="record">#</th>
                    <th class="time">Time</th>
                    <th class="record">Type</th>
                    <th class="address">Source</th>
                    <th class="">Details</th>
                    <th class="view"></th>
                </tr>
            </thead>
            <tbody>
            </tbody>
            </table>
        </div>
    </div>
</div>

<script type="text/javascript">
    $(document).ready(function(){

        // Array to some misc values used for tracking offset and direction
        var misc = [];
        misc['last_start'] = 0;

        // Keep track of records per page
        var sm   = localStorage,
            rec  = sm.getItem('records_per_page_unconfirmed');
            page = (rec) ? parseInt(rec) : 10;

        // Detect any 'per page' changes and save to localStorage
        $('.table').on( 'length.dt', function ( e, settings, length ){
            sm.setItem('records_per_page_unconfirmed',length);
        });

        $('.table').dataTable({
            ajax: {
                url: "/explorer/mempool",
                data: function(data){
                    // Pass action and offset with request
                    var action = null,
                        offset = null;
                    if(data.start==0){
                        action = 'first';
                    } else if(data.start > (misc['last_start'] + data.length)){
                        action = 'last';
                    } else if(data.start >= misc['last_start']){
                        action = 'next';
                        offset = misc['offset_last'];
                    } else {
                        action = 'prev';
                        offset = misc['offset_first'];
                    }
                    // Cleanup the request so we only send what we need
                    // data.action = action;
                    // data.offset = offset;
                    delete data.columns;
                    delete data.order;
                    delete data.search;
                    delete data.draw;
                }
            },
            pageLength: page,
            dom: '<"search-options center"<"pull-left hidden-xs"l>p<"pull-right hidden-xs"i>><"search-results"t>',
            pagingType: "full",
            serverSide: true,
            searching: false,
            ordering: false,
            processing: true,
            autoWidth: false,
            language: {
                lengthMenu: "_MENU_ per page",
                zeroRecords: "No records found",
                info: "_TOTAL_ results",
                // info: "Displaying _START_ - _END_ of _TOTAL_",
                infoEmpty: "No records available",
                paginate: {
                    first: "<i class='fa fa-chevron-left'></i><i class='fa fa-chevron-left'></i>",
                    previous: "<i class='fa fa-chevron-left'></i>",
                    next: "<i class='fa fa-chevron-right'></i>",
                    last: "<i class='fa fa-chevron-right'></i><i class='fa fa-chevron-right'></i>"
                }
            },
            createdRow: function(row, data, idx){
                var type = data[2],
                    json = JSON.parse(data[4]),
                    icon = '';
                if(type=='Bet')       icon = 'fa-trophy';
                if(type=='Broadcast') icon = 'fa-bullhorn';
                if(type=='Burn')      icon = 'fa-fire';
                if(type=='Dividend')  icon = 'fa-sitemap';
                if(type=='Issuance')  icon = 'fa-bank';
                if(type=='Order')     icon = 'fa-book';
                if(type=='Send')      icon = 'fa-send';
                if(type=='Cancel')    icon = 'fa-ban';
                $('td', row).eq(0).html(numeral(data[0]).format('0,0'));
                $('td', row).eq(1).html('<span data-livestamp='  + data[1] + ' class="nowrap"></span>');
                $('td', row).eq(2).html('<i class="fa fa-lg '  + icon + '"></i>&nbsp;' + type + '</span>');
                $('td', row).eq(3).html('<a href="/address/' + data[3] + '">' + data[3] + '</a>');
                // Build out basic description of what is happening in transaction
                var txt = data[4];
                if(type=='Bet'){
                    txt = '<img src="/icon/XCP.png" class="asset-icon-sm pull-left">' + numeral(json.wager_quantity).format('0,0.00000000') + ' <a href="/asset/XCP">XCP</a> at ' + numeral(json.fee).format('0,0.00') + '% on feed <a href="/address' +  json.feed_address + '">' + json.feed_address + '</a>';
                } else if(type=='Broadcast'){
                    txt = json.text;
                } else if(type=='Burn'){
                    txt = numeral(json.burned).format('0,0.00000000') + ' BTC burned for ' + numeral(json.earned).format('0,0.00000000') + ' <a href="/asset/XCP">XCP</a>';
                } else if(type=='Cancel'){
                    txt = 'Cancel order <a href="/tx/' +  json.offer_hash + '">' + json.offer_hash + '</a>';
                } else if(type=='Dividend'){
                    var fmt = (String(json.quantity_per_unit).indexOf('.')==-1) ? '0,0' : '0,0.00000000';
                    txt = numeral(json.quantity_per_unit).format(fmt) + ' <img src="/icon/' + json.dividend_asset + '.png" class="asset-icon-sm pull-left"><a href="/asset/' +  json.dividend_asset + '">' + json.dividend_asset + '</a> to holders of <img src="/icon/' + json.asset + '.png" class="asset-icon-sm"><a href="/asset/' +  json.asset + '">' + json.asset + '</a>';
                } else if(type=='Issuance'){
                    if(json.transfer){
                        txt = 'Transfer ownership of <img src="/icon/' + json.asset + '.png" class="asset-icon-sm"> <a href="/asset/' +  json.asset + '">' + json.asset + '</a> to <a href="/address/' + json.issuer + '">' + json.issuer + '</a>';
                    } else if(json.locked){
                        txt = 'Lock supply of <img src="/icon/' + json.asset + '.png" class="asset-icon-sm pull-left"><a href="/asset/' +  json.asset + '">' + json.asset + '</a>';
                    } else if(json.quantity){
                        var fmt = (String(json.quantity).indexOf('.')==-1) ? '0,0' : '0,0.00000000';
                        txt = 'Issue ' + numeral(json.quantity).format(fmt) + ' <img src="/icon/' + json.asset + '.png" class="asset-icon-sm pull-left"><a href="/asset/' +  json.asset + '">' + json.asset + '</a> tokens';
                    } else {
                        txt = 'Register / Update <img src="/icon/' + json.asset + '.png" class="asset-icon-sm pull-left"> <a href="/asset/' +  json.asset + '">' + json.asset + '</a>';
                    }
                } else if(type=='Order'){
                    var fmtA = (String(json.get_quantity).indexOf('.')==-1) ? '0,0' : '0,0.00000000',
                        fmtB = (String(json.give_quantity).indexOf('.')==-1) ? '0,0' : '0,0.00000000';
                    txt = numeral(json.get_quantity).format(fmtA)  + ' <img src="/icon/' + json.get_asset  + '.png" class="asset-icon-sm pull-left"><a href="/asset/' +  json.get_asset + '">' + json.get_asset + '</a> for ' +
                          ' <img src="/icon/' + json.give_asset + '.png" class="asset-icon-sm">' + numeral(json.give_quantity).format(fmtB) + ' <a href="/asset/' +  json.give_asset + '">' + json.give_asset + '</a>';
                } else if(type=='Send'){
                    var fmt = (String(json.quantity).indexOf('.')==-1) ? '0,0' : '0,0.00000000';
                    txt = numeral(json.quantity).format(fmt) + ' <img src="/icon/' + json.asset + '.png" class="asset-icon-sm pull-left"><a href="/asset/' +  json.asset + '">' + json.asset + '</a> to <a href="/address/' + json.destination + '">' + json.destination + '</a>';
                }
                $('td', row).eq(4).html(txt);
                $('td', row).eq(5).html('<a href="/tx/' + data[5] + '" class="btn btn-xs btn-success pull-right">view</a>');
            },
            fnDrawCallback: function( o ){
                var total  = o._iRecordsTotal,
                    length = o._iDisplayLength,
                    stop   = o._iDisplayStart + length,
                    page   = stop / length,
                    pages  = total / length;
                if(pages > parseInt(pages))
                    pages = parseInt(pages) + 1;
                // Add 'Page X of Y' in between previous/next buttons
                $('.paginate_button.previous').after('&nbsp;&nbsp;Page ' + numeral(page).format('0,0') + ' of ' + numeral(pages).format('0,0') + '&nbsp;&nbsp;')
                // Track first and last shown tx_index (used for offset tracking)
                if(o.json.data && o.json.data.length){
                    var first = o.json.data[0],
                        last  = o.json.data[o.json.data.length-1];
                    misc['offset_first'] = first[first.length-1];
                    misc['offset_last']  = last[last.length-1];
                } else {
                    misc['offset_first'] = 0;
                    misc['offset_last']  = 0;
                }
                // Save the start so we can determine direction when user clicks (prev/next)
                misc['last_start'] = o._iDisplayStart;
            }

        });

    });
</script>
