<!-- Issues -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-bank"></i> Issues
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-issue">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="token">Token</th>
                        <th>Description</th>
                        <th>Max Supply</th>
                        <th>Max Mint</th>
                        <th>Locks</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="9" class="loading-data">Loading issue data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    // Update the page with SEO friendly info
    XC.pageInfo.title       = 'ISSUE Actions';
    XC.pageInfo.description = 'Learn about the ISSUE actions on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network - This page displays a list of ISSUE actions on the XChain platform';
    XC.pageInfo.canonical   = '/' + XC.coin + '/issues';
    updatePageInfo();

    // Load all `issue` actions
    loadDatatablesData(XC.coin, 'issue', null, null);

});
</script>
