<!-- Cross-Chain Settlements (local settlement legs of cross-chain matches) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-handshake"></i> Cross-Chain Settlements
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-cross_chain_settlement">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="">Match</th>
                        <th class="">Local Action</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6" class="loading-data">Loading cross-chain settlement data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Cross-Chain Settlements';
    XC.pageInfo.description = 'Local settlement legs of cross-chain DEX matches on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/cross_chain_settlements';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'cross_chain_settlement', null, null);

});
</script>
