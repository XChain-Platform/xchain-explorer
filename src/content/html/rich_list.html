<!-- Rich list and supply stats for one token: holder ranking plus the supply
     figures the ranking is measured against. -->
<style>
.rich-list-label {
    width: var(--xc-token-info-th-width);
}
</style>

<div class="container mt-3">
    <div class="row">

        <div class="col-12 col-lg-5">
            <div class="card mb-3">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-chart-pie"></i> Supply
                    <span class="fw-normal" id="rich-list-tick"></span>
                </div>
                <div class="card-body p-2">
                    <table class="table table-sm table-borderless mb-0">
                        <tbody id="rich-list-supply">
                            <tr><td class="text-muted">Loading supply stats...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-7">
            <div class="card mb-3">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-ranking-star"></i> Largest Holders
                </div>
                <div class="card-body p-2">
                    <div id="rich-list-holders">
                        <span class="text-muted">Loading holders...</span>
                    </div>
                    <div id="rich-list-coverage" class="mt-1"></div>
                </div>
            </div>
        </div>

    </div>
</div>

<script type="text/javascript" src="/js/rich-list-render.js"></script>
<script type="text/javascript">
$(document).ready(function() {

    $('#rich-list-tick').text(XC.query);

    XC.pageInfo.title       = XC.query + ' Rich List';
    XC.pageInfo.description = 'Largest holders and supply statistics for the token ' + XC.query + ' on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/rich_list/' + XC.query;
    updatePageInfo();

    $.getJSON('/' + XC.coin + '/api/rich_list/' + encodeURIComponent(XC.query), function(o){
        // Single-resource routes answer a BARE object; the {total, data} envelope
        // is accepted too rather than assumed away, matching the xcall page.
        var d = null;
        if(o){
            if(!isNull(o.data))    d = Array.isArray(o.data) ? o.data[0] : o.data;
            else if(!isNull(o.tick)) d = o;
        }
        if(!d){
            // Explicit not-found. A tick can be interned by a reference without ever
            // having been issued, so "no such token" is a real answer here, not a bug.
            $('#rich-list-supply').html('<tr><td class="text-muted">No token is issued under this tick.</td></tr>');
            $('#rich-list-holders').html('<span class="text-muted">No holders to show.</span>');
            return;
        }
        $('#rich-list-tick').html(formatLink('/' + XC.coin + '/token/' + encodeURIComponent(String(d.tick)), $('<div>').text(d.tick).html()));
        $('#rich-list-supply').html(renderRichListSupply(d));
        $('#rich-list-holders').html(renderRichListHolders(d));
        $('#rich-list-coverage').html(renderRichListCoverage(d));
    }).fail(function(xhr){
        var body = (xhr && xhr.responseJSON) ? xhr.responseJSON : {};
        var msg  = body.error ? body.error : 'Could not load this rich list';
        $('#rich-list-supply').html('<tr><td class="text-danger rich-list-error">' + $('<div>').text(msg).html() + '</td></tr>');
        $('#rich-list-holders').html('<span class="text-muted">-</span>');
    });

});
</script>
