; Drop-in for /etc/systemd/system/xchain-explorer.service.d/ widening the
; freshness gates for Bitcoin testnet4 only. Unlike the endpoint drop-ins
; beside it on the box, this one is POLICY, so it is version-controlled here.
;
; Why the skew gate moves: testnet4 miners legally stamp a tip up to +2h ahead
; (the min-difficulty timestamp game), and the default future-skew gate is
; exactly 2h, so a stamped-at-limit tip plus ordinary clock drift 503s a coin
; that is perfectly healthy. A coin node cannot accept a block more than 2h in
; the future, so 3h can never false-trip and still bounds insanity.
;
; Why the age gate moves: testnet4 stalls in bursts; serving hours-old testnet
; data beats an error page for anyone checking their transaction, and stale or
; halted replicas now alert the operator directly (bin/check-explorer-freshness.sh)
; instead of relying on this gate as the only tell. Mainnet keeps the strict
; defaults on purpose.

[Service]
Environment=EXPLORER_TIP_MAX_FUTURE_SKEW_S_TBTC=10800
Environment=EXPLORER_TIP_MAX_AGE_S_TBTC=86400
