<!-- Governance Votes (hub-owned `governance_votes`, read from the co-located hub DB) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-check-to-slot"></i> Governance Votes
                </div>
                <table class="table table-striped cell-border table-hover table-condensed" width="100%" id="datatable-governance_vote">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="time">Time</th>
                        <th class="">Proposal</th>
                        <th class="">Voter</th>
                        <th class="">Vote</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="5" class="loading-data">Loading governance vote data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Governance Votes';
    XC.pageInfo.description = 'Per-validator governance votes on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/governance_votes';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'governance_vote', null, null);

});
</script>
