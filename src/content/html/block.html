<!-- Block Information -->
<div class="container mt-3">
    <div class="row">

        <div class="col-xs-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-cube"></i> Block <span id="blockIndex"></span>
                </div>
                <table class="table table-sm table-striped table-hover table-bordered mb-0" width="100%">
                <tbody>
                <tr>
                    <td class="info" style="width: 150px"><i class="fa fa-lg fa-plus"></i> Credits Hash</td>
                    <td id="creditsHash"></td>
                </tr>
                <tr>
                    <td class="info"><i class="fa icon-20 fa-minus"></i> Debits Hash</td>
                    <td id="debitsHash"></td>
                </tr>
                <tr>
                    <td class="info"><i class="fa icon-20 fa-list"></i> Actions Hash</td>
                    <td id="actionsHash"></td>
                </tr>
                <tr>
                    <td class="info">Time</td>
                    <td id="blockTime"></td>
                </tr>
                </tbody>
                </table>
                <!-- Block Transactions -->
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-history">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="asset-name">Action</th>
                        <th class="">Details</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function(){

    if(XC.query){

        // Request information on this block and update the header with this information
        loadApiData(XC.coin, 'block', XC.query, null, function(o){
            $('#blockIndex').text(numeral(o.block_index).format('0,0'));
            $('#blockTime').html(formatLivestamp(o.timestamp));
            $('#creditsHash').text(o.credits_hash);
            $('#debitsHash').text(o.debits_hash);
            $('#actionsHash').text(o.actions_hash);
        });

        // Load all `history` actions for the given block
        loadDatatablesData('BTC', 'history', XC.query, 'block');        
    }

});
</script>
