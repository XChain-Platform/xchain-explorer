<!-- BET markets (parimutuel prediction markets; bet_feeds table, BET format 0) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-coins"></i> Betting Markets
                    <!-- Open/All toggle: server-side feed_status filter via
                         /explorer/bet_feeds/open/status (?status=open reloads the page) -->
                    <span class="float-end" id="bet-status-toggle">
                        <a class="badge text-bg-secondary border me-1" id="bet-filter-open">Open</a>
                        <a class="badge text-bg-secondary border" id="bet-filter-all">All</a>
                    </span>
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-bet_feed">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Oracle</th>
                        <th class="">Token</th>
                        <th class="">Market</th>
                        <th class="">Status</th>
                        <th class="">Closes</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="9" class="loading-data">Loading market data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    // Update the page with SEO friendly info
    XC.pageInfo.title       = 'Betting Markets';
    XC.pageInfo.description = 'Decentralized parimutuel betting markets on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network. Anyone can run a market; payouts are split among the winning bettors.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/bet_feeds';
    updatePageInfo();

    // ?status=open narrows the list to markets still accepting bets; default
    // shows the full history. The status filter reads the STORED feed status,
    // so a market that has latched closed shows as closed even if a block's
    // timestamp would suggest otherwise.
    let openOnly = new URLSearchParams(window.location.search).get('status') == 'open';
    $('#bet-filter-open').attr('href', '/' + XC.coin + '/bet_feeds?status=open');
    $('#bet-filter-all').attr('href', '/' + XC.coin + '/bet_feeds');
    $(openOnly ? '#bet-filter-open' : '#bet-filter-all').removeClass('text-bg-secondary').addClass('text-bg-success');

    if(openOnly)
        loadDatatablesData(XC.coin, 'bet_feed', 'open', 'status');
    else
        loadDatatablesData(XC.coin, 'bet_feed', null, null);

});
</script>
