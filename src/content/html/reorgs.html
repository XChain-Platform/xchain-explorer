<!-- Reorg History (hub-attested chain reorganizations, M3.5) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-code-branch"></i> Reorg History
                </div>
                <table class="table table-striped cell-border table-hover table-condensed" width="100%" id="datatable-reorg">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="time">Time</th>
                        <th class="block">Height</th>
                        <th class="">Reorg ID</th>
                        <th class="">Affected Chains</th>
                        <th class="">Validators</th>
                        <th class="">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="7" class="loading-data">Loading reorg history...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Reorg History';
    XC.pageInfo.description = 'Quorum-attested chain reorganizations recorded by the federation hub for the ' + XC.name + ' (' + XC.network + ') blockchain network on the XChain Platform.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/reorgs';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'reorg', null, null);

});
</script>
