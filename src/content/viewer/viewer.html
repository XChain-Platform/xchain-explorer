<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>XChain Content Viewer</title>
</head>
<body>
<script>
(function () {
    'use strict';

    function receiveHtml(e) {
        if (e.source !== window.parent
            || !e.data
            || e.data.type !== 'xchain-viewer-html'
            || typeof e.data.html !== 'string') return;

        window.removeEventListener('message', receiveHtml);
        document.open();
        document.write(e.data.html);
        document.close();
    }

    window.addEventListener('message', receiveHtml);
    window.parent.postMessage({ type: 'xchain-viewer-ready' }, '*');
}());
</script>
</body>
</html>
