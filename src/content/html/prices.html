<!-- Prices -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-tags"></i> Prices
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-price">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Source</th>
                        <th class="">Type</th>
                        <th class="">Coin</th>
                        <th class="token">Token</th>
                        <th class="">Fiat</th>
                        <th class="quantity">Value</th>
                        <th class="">Fee</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="11" class="loading-data">Loading price data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    // Update the page with SEO friendly info
    XC.pageInfo.title       = 'PRICE Actions';
    XC.pageInfo.description = 'Oracle prices published on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network - validator COIN/FIAT snapshots (v0) and permissionless user-run TOKEN/FIAT oracles (v1).';
    XC.pageInfo.canonical   = '/' + XC.coin + '/prices';
    updatePageInfo();

    // Load all `price` actions
    loadDatatablesData(XC.coin, 'price', null, null);

});
</script>
