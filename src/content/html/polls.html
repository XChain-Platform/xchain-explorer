<!-- VOTE Polls (token-weighted governance; polls table, VOTE v0) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-check-to-slot"></i> Governance Polls
                    <!-- Open/All toggle: server-side poll_status filter via
                         /explorer/polls/open/status (?status=open reloads the page) -->
                    <span class="float-end" id="poll-status-toggle">
                        <a class="badge text-bg-secondary border me-1" id="poll-filter-open">Open</a>
                        <a class="badge text-bg-secondary border" id="poll-filter-all">All</a>
                    </span>
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-poll">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Creator</th>
                        <th class="">Token</th>
                        <th class="">Question</th>
                        <th class="">Status</th>
                        <th class="">Closes</th>
                        <th class="">Binding</th>
                        <!-- The outcome. polls.winning_option is an INDEX into the poll's
                             options, so option 0 is a real winner: this column reads '-'
                             only where no outcome has been recorded at all. -->
                        <th class="">Winner</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="11" class="loading-data">Loading poll data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    // Update the page with SEO friendly info
    XC.pageInfo.title       = 'VOTE Polls';
    XC.pageInfo.description = 'Token-weighted governance polls on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network. Token holders create and vote on on-chain polls.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/polls';
    updatePageInfo();

    // ?status=open narrows the list to polls still accepting ballots (the
    // governance-visibility view); default shows the full history.
    let openOnly = new URLSearchParams(window.location.search).get('status') == 'open';
    $('#poll-filter-open').attr('href', '/' + XC.coin + '/polls?status=open');
    $('#poll-filter-all').attr('href', '/' + XC.coin + '/polls');
    $(openOnly ? '#poll-filter-open' : '#poll-filter-all').removeClass('text-bg-secondary').addClass('text-bg-success');

    // Load `poll` actions (optionally filtered to the open lifecycle status)
    if(openOnly)
        loadDatatablesData(XC.coin, 'poll', 'open', 'status');
    else
        loadDatatablesData(XC.coin, 'poll', null, null);

});
</script>
