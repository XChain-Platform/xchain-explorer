<!-- Validator Capabilities (hub-owned `validator_capabilities`, read from the co-located hub DB) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-list-check"></i> Validator Capabilities
                </div>
                <table class="table table-striped cell-border table-hover table-condensed" width="100%" id="datatable-validator_capability">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="time">Updated</th>
                        <th class="">Signing Key</th>
                        <th class="">Capability</th>
                        <th class="">Qualified</th>
                        <th class="">Self-Test</th>
                        <th class="">Enabled</th>
                        <th class="block">Qualified Block</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="8" class="loading-data">Loading validator capability data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Validator Capabilities';
    XC.pageInfo.description = 'Per-validator per-capability qualification flags (price, cross_chain, oracle_publish, attestation, full_node) on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/validator_capabilities';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'validator_capability', null, null);

});
</script>
