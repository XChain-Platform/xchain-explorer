<!-- XCALL cross-chain calls -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-link"></i> Cross-Chain Calls
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-xcall">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="">Source Contract</th>
                        <th class="">Target Chain</th>
                        <th class="">Target Contract</th>
                        <th class="">Method</th>
                        <th class="">Status</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="9" class="loading-data">Loading cross-chain call data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    // Update the page with SEO friendly info
    XC.pageInfo.title       = 'XCALL Cross-Chain Calls';
    XC.pageInfo.description = 'Cross-chain calls (XCALL) on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network — contract-emitted calls dispatched to a target chain, with their execution outcome and callback delivery.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/xcalls';
    updatePageInfo();

    // Load all `xcall` actions
    loadDatatablesData(XC.coin, 'xcall', null, null);

});
</script>
