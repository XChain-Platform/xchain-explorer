<!-- Fees -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-cent-sign"></i> Fees
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-fee">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Source</th>
                        <th class="token">Token</th>
                        <th class="">Amount</th>
                        <th class="">Method</th>
                        <th class="">Action</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="9" class="loading-data">Loading fee data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    // Update the page with SEO friendly info
    XC.pageInfo.title       = 'Fees';
    XC.pageInfo.description = 'Learn about the fees used to perform certain actions on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network - This page displays a list of action fees on the XChain platform';
    XC.pageInfo.canonical   = '/' + XC.coin + '/fees';
    updatePageInfo();

    // Load all `address` actions
    loadDatatablesData(XC.coin, 'fee', null, null);

});
</script>
