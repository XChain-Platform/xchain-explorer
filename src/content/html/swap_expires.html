<!-- Swap Expirations (SWAP_EXPIRE: the protocol retiring an unfilled swap) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-hourglass-end"></i> Swap Expirations
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-swap_expire">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Source</th>
                        <th class="">Swap</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6" class="loading-data">Loading swap expiration data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Swap Expirations';
    XC.pageInfo.description = 'Swaps retired unfilled at their expiration (SWAP_EXPIRE) on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/swap_expires';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'swap_expire', null, null);

});
</script>
