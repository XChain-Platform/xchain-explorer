<!-- BET wagers (one row per placed bet; bets table, BET format 2) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-dice"></i> Bets
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-bet">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Bettor</th>
                        <th class="">Market</th>
                        <th class="">Outcome</th>
                        <th class="">Token</th>
                        <th class="">Stake</th>
                        <th class="">Status</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="10" class="loading-data">Loading bet data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Bets';
    XC.pageInfo.description = 'Bets placed on decentralized betting markets on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/bets';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'bet', null, null);

});
</script>
