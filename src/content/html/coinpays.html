<!-- Coinpay Settlements (COINPAY payments discharging an obligation) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-hand-holding-dollar"></i> Coinpay Settlements
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-coinpay">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="time">Time</th>
                        <th class="address">Source</th>
                        <th class="">Obligation</th>
                        <th class="">Amount</th>
                        <th class="">TXID</th>
                        <th class="">Vout</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="9" class="loading-data">Loading coinpay settlement data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Coinpay Settlements';
    XC.pageInfo.description = 'Native-coin payments (COINPAY) discharging cross-chain obligations on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/coinpays';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'coinpay', null, null);

});
</script>
