<!-- Coinpay Obligations (who owes what native coin, expiring when) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-coins"></i> Coinpay Obligations
                </div>
                <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-coinpay_obligation">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="block">Block</th>
                        <th class="address">Payer</th>
                        <th class="address">Payee</th>
                        <th class="">Coin</th>
                        <th class="">Amount Owed</th>
                        <th class="block">Expires</th>
                        <th class="">Status</th>
                        <th class="view"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="9" class="loading-data">Loading coinpay obligation data...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Coinpay Obligations';
    XC.pageInfo.description = 'Outstanding native-coin obligations created by cross-chain order matches on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/coinpay_obligations';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'coinpay_obligation', null, null);

});
</script>
