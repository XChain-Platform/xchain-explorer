<!-- Attestation Validator Stats (per-validator per-provider ATTEST accountability counters) -->
<div class="container mt-3">
    <div class="row">

        <div class="col-12">
            <div class="card table-responsive">
                <div class="card-title mb-0 p-1 fw-bold">
                    <i class="fa fa-lg fa-shield-halved"></i> Attestation Validator Stats
                </div>
                <table class="table table-striped cell-border table-hover table-condensed" width="100%" id="datatable-attest_validator_stat">
                <thead>
                    <tr class="info">
                        <th class="record">#</th>
                        <th class="">Validator</th>
                        <th class="">Provider</th>
                        <th class="">Fulfilled</th>
                        <th class="">Missed</th>
                        <th class="">Slashed</th>
                        <th class="">Quality Score</th>
                        <th class="block">Last Block</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="8" class="loading-data">Loading attestation validator stats...</td>
                    </tr>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(document).ready(function() {

    XC.pageInfo.title       = 'Attestation Validator Stats';
    XC.pageInfo.description = 'Per-validator per-provider ATTEST accountability counters (fulfilled/missed/slashed + quality score) on the XChain Platform on the ' + XC.name + ' (' + XC.network + ') blockchain network.';
    XC.pageInfo.canonical   = '/' + XC.coin + '/attest_validator_stats';
    updatePageInfo();

    loadDatatablesData(XC.coin, 'attest_validator_stat', null, null);

});
</script>
