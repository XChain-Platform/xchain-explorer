<!-- Transaction Information -->
<div class="container mt-3">
    <div class="row">
        <div class="col-xs-12">

            <!-- Transaction Information -->
            <div class="card table-responsive mb-3">
                <a href="#" class="text-decoration-none text-reset collapse-header" data-bs-toggle="collapse" data-bs-target="#transaction-info" aria-expanded="false" aria-controls="transaction-info" id="transaction-info-header">
                    <div class="card-title mb-0 p-1 fw-bold">
                        <i class="fa fa-chain asset-icon-sm"></i> Transaction Information
                        <span class="float-end"><i class="fa fa-chevron-up collapse-icon"></i></span>
                    </div>
                </a>
                <div class="collapse show" id="transaction-info">
                    <table class="table table-sm table-striped table-hover table-bordered mb-0" width="100%">
                    <tbody>
                    <tr>
                        <th width="155">Transaction Hash</th>
                        <td id="tx-hash"></td>
                    </tr>
                    <tr>
                        <th>Transaction Index</th>
                        <td id="tx-index"></td>
                    </tr>
                    <tr>
                        <th>Source</th>
                        <td id="source"></td>
                    </tr>
                    <tr>
                        <th>Block #</th>
                        <td id="block"></td>
                    </tr>
                    <tr>
                        <th>Time</th>
                        <td id="timestamp"></td>
                    </tr>
                    </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>



<!-- Action List -->
<div class="container">
    <div class="row">
        <div class="col-sm-12">

            <!-- Tab Content -->
            <div class="tab-content border mb-3 rounded-corners" id="data-panels">

                <!-- Actions header -->
                <div class="container">
                    <div class="row border-bottom">
                        <div class="col-6 text-start pt-1 pb-1 ps-1 align-top fw-bold">
                            <i id="datatable-header-icon" class="fa fa-info-circle"></i>
                            <span id="datatable-header-text">Action Details</span>
                        </div>
                        <!--
                        <div class="col-6 text-end   pt-0 pb-1 pe-1 align-middle">
                            <div class="dropdown">
                                <button class="badge badge-sm bg-success dropdown-toggle border" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                    more info
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li><a class="dropdown-item" id="tab-dropdown-info"   ><i class="fa fa-info-circle"></i> Details</a></li>
                                    <li><a class="dropdown-item" id="tab-dropdown-rawdata"><i class="fa fa-code"       ></i> Raw Data</a></li>
                                </ul>
                            </div>
                        </div>
                        -->
                    </div>
                </div>

                <!--  Actions  -->
                <div class="tab-pane fade table-responsive show active" id="tab-pane-info" role="tabpanel" aria-labelledby="tab-info" tabindex="0">
                    <table class="table table-striped cell-border view-button table-hover table-condensed" width="100%" id="datatable-actions">
                    <thead>
                        <tr class="info">
                            <th class="record">#</th>
                            <th class="">Action Index</th>
                            <th class="">Action</th>
                            <th class="">Details</th>
                            <th class="">Status</th>
                            <th class=""></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="4" class="loading-data">Loading action data...</td>
                        </tr>
                    </tbody>
                    </table>
                </div>

                <!--  Raw Data  -->
                <div class="tab-pane fade table-responsive" id="tab-pane-rawdata" role="tabpanel" aria-labelledby="tab-rawdata" tabindex="0">
                    <div class="card-body">
                        Coming soon...
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>



<script type="text/javascript">
$(document).ready(function(){

    // Build out a list of data panels for this page
    XC.panels = [
        'info',
        'rawdata'
    ];

    if(XC.query){

        // Request information on this transaction, store the response in XC.transactionInfo, and update the page with the details
        loadApiData(XC.coin, 'transaction', XC.query, XC.type, function(o){
            XC.transactionInfo = null2string(o);
            showTransactionDetails();
        });

        // Setup listeners to load data panel when an action button is clicked
        setupActionListeners();

    }

});
</script>
